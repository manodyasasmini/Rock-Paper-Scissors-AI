<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 220" width="1600" height="220" font-family="Poppins, 'Segoe UI', Arial, sans-serif">
  <title>Workflow: name, camera check, countdown, throw and reveal, report</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a5a"/></marker>
  </defs>
  <g fill="#e8eefc" stroke="#1e2a5a" stroke-width="4">
    <rect x="10" y="20" width="270" height="180" rx="24"/>
    <rect x="335" y="20" width="270" height="180" rx="24"/>
    <rect x="660" y="20" width="270" height="180" rx="24"/>
    <rect x="985" y="20" width="270" height="180" rx="24"/>
    <rect x="1310" y="20" width="280" height="180" rx="24"/>
  </g>
  <g stroke="#1e2a5a" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M288,110 L326,110" marker-end="url(#a)"/>
    <path d="M613,110 L651,110" marker-end="url(#a)"/>
    <path d="M938,110 L976,110" marker-end="url(#a)"/>
    <path d="M1263,110 L1301,110" marker-end="url(#a)"/>
  </g>
  <g text-anchor="middle" fill="#1e2a5a" font-weight="700" font-size="30">
    <text x="145" y="92">NAME</text>
    <text x="470" y="68">CAMERA</text><text x="470" y="104">CHECK</text>
    <text x="795" y="92">COUNTDOWN</text>
    <text x="1120" y="68">THROW +</text><text x="1120" y="104">REVEAL</text>
    <text x="1450" y="92">REPORT</text>
  </g>
  <g text-anchor="middle" fill="#3b4666" font-size="23">
    <text x="145" y="130">join the</text><text x="145" y="160">leaderboard</text>
    <text x="470" y="146">hold your</text><text x="470" y="176">hand up</text>
    <text x="795" y="130">AI locks its</text><text x="795" y="160">move</text>
    <text x="1120" y="146">gesture read,</text><text x="1120" y="176">winner shown</text>
    <text x="1450" y="130">what it learned</text>
  </g>
</svg>
